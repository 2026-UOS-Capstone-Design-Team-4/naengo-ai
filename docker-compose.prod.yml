services:
  naengo-ai-blue:
    image: ${NAENGO_AI_IMAGE:-ghcr.io/2026-uos-capstone-design-team-4/naengo-ai:latest}
    container_name: naengo-ai-blue
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file: .env.prod
    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro

  naengo-ai-green:
    image: ${NAENGO_AI_IMAGE:-ghcr.io/2026-uos-capstone-design-team-4/naengo-ai:latest}
    container_name: naengo-ai-green
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    env_file: .env.prod
    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro
