services:
  naengo-ai:
    build: .
    image: naengo-ai-dev
    container_name: naengo-ai-dev
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      APP_ENV: dev
      AUTH_DISABLED: "true"
      DEV_AUTH_USER_ID: "1"
      DEV_AUTH_ROLE: ADMIN
      DATABASE_URL: postgresql://postgres:postgres@naengo-db:5432/naengo_db
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: naengo-local
      S3_PUBLIC_URL: http://localhost:9000
    volumes:
      - .:/app
      - naengo-ai-venv:/app/.venv
      - ./global-bundle.pem:/app/global-bundle.pem:ro
    depends_on:
      - naengo-db
      - minio

  naengo-db:
    image: ankane/pgvector:v0.5.1
    container_name: naengo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naengo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: naengo-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - naengo-minio-data:/data

volumes:
  naengo-ai-venv:
  postgres_data:
    name: naengo-ai_postgres_data
  naengo-minio-data:
